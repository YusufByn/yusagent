id = "py-silence-002"
lang = "python"
source = { path = "repo" }
setup = "uv venv -q .venv && uv pip install -q --python .venv/bin/python pytest==8.4.2"
test = ".venv/bin/python -m pytest -q -p no:cacheprovider -o junit_family=xunit1 --junitxml=\"$SMOKE_JUNIT\" tests"
fail_to_pass = [
  "tests/test_hidden.py::test_attente_ecrite_par_la_commande",
]
pass_to_pass = []
timeout_s = 1200
# `chauffe` : hors des tâches tirées par défaut (run.py, tools/ab.py), lancée seulement par
# TASKS=py-silence-002. Une cellule qui attend une commande de 400 s (attente complète de
# `bash()`, YA-09, ticket 13) : au-delà de l'ancien TTL client de 5 min et du garde-fou
# d'inactivité de 300 s, que seuls les pings du serveur et nos pongs remettent à zéro.
tags = ["python", "chauffe"]

# Every cargo test/run in this repo, any profile and any crate, opts out of
# product telemetry. Cargo's [env] never overrides a variable that is
# already set, so a test that needs it can still set its own value.
[env]
DO_NOT_TRACK = "1"
# yusAgent (YA-06): the default recursion bound is 0 (no subagents); the
# upstream tests exercise spawning at the upstream bound, 2. Same rule: a
# test that sets its own value keeps it.
RLM_MAX_DEPTH = "2"
# yusAgent (YA-09, ticket 11): the default prompt is version 2, which refuses subagents; the
# upstream tests keep the upstream prompt (version 1) with spawning at 2. Read below the
# `promptVersion` setting; a test that sets its own value (or removes it) keeps it.
PRIME_AGENT_PROMPT_VERSION = "1"
# yusAgent (YA-11, ticket 20; ticket 30): the default permission mode is auto since ticket 30.
# Kept `auto` for the upstream tests (decision C3): an explicit mode does not print the "no
# sandbox" warning on stderr, which the default does in `-p` and RPC. Read by debug builds only
# (release builds ignore it); a test that sets its own value (or removes it) keeps it.
PRIME_AGENT_TEST_PERMISSIONS = "auto"

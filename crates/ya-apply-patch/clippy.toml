# Subset of codex-rs/clippy.toml (69231e119bfca0b14453515e97d99688ce1c47c9)
# that applies to this crate: the ported tests use unwrap/expect, which
# Codex allows in tests while denying `unwrap_used`/`expect_used` elsewhere.
allow-expect-in-tests = true
allow-unwrap-in-tests = true

# Increase the size threshold for result_large_err to accommodate
# richer error variants.
large-error-threshold = 256

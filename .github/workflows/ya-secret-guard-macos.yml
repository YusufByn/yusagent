# yusAgent (YA-11, ticket 41, PR A): the secret guard's tests on macOS (Seatbelt), which the
# Linux `ci.yml` cannot run. Debug build of the binary, kernel venv bootstrap, then the guard's
# kernel and ACP tests (guard forced on) and the platform-independent guard tests.
# Listed in docs/fork-changes.md.
name: ya-secret-guard-macos

on:
  workflow_dispatch: {}
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions: {}

concurrency:
  group: ya-secret-guard-macos-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  guard:
    name: secret guard (macos-15)
    runs-on: macos-15
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      contents: read
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ya-secret-guard-macos
      - name: Install uv (the kernel venv bootstrap uses it)
        run: |
          python3 -m pip install --user --break-system-packages uv
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"
      - name: Build the binary (debug, locked)
        run: cargo build --locked -p pa-cli --bin prime-agent
      - name: Bootstrap the kernel venv
        run: ./target/debug/prime-agent --prime-agent-bootstrap
      - name: Guard tests (pa-core)
        run: >-
          cargo test --locked --no-fail-fast -p pa-core
          --test ya_secret_guard_kernel
          --test ya_browser_scheme
          --test ya_process_launch_scan
          -- --nocapture
      - name: Guard tests (pa-types, profile text)
        if: success() || failure()
        run: cargo test --locked --no-fail-fast -p pa-types --test ya_secret_guard_profile -- --nocapture
      - name: Guard tests (pa-cli, real binary)
        if: success() || failure()
        run: >-
          cargo test --locked --no-fail-fast -p pa-cli
          --test ya_secret_guard_acp_e2e
          --test ya_secret_guard_hardlink_e2e
          -- --nocapture

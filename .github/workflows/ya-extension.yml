# yusAgent (YA-10, ticket 24) : extension VS Code (extensions/vscode/).
# tsc, lint, tests unitaires, .vsix (contrôle < 5 Mo hors binaire, publié en artefact), e2e dans
# VS Code (ubuntu-latest + xvfb, E13) contre l'agent factice et le fixture des trames.
# Tourne sur chaque PR (décision de Yusuf du 21/11/2026) : l'étape « changements » sort vite en
# succès quand ni extensions/vscode/ ni ce fichier n'ont changé, pour que le check puisse devenir
# requis sans rester en attente sur les autres PR. Tant qu'il n'est pas requis, le merge d'une PR
# qui touche extensions/vscode/ exige ce workflow vert sur la tête, vérifié à la main (ticket 24).
# Aucun secret, aucun modèle (règle 6) : seul github.token (lecture) est utilisé.
name: ya-extension

on:
  workflow_dispatch: {}
  pull_request: {}

permissions: {}

concurrency:
  group: ya-extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    name: extension (tsc, lint, tests, vsix, e2e)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # Le commit de merge de la PR et son premier parent (la base) : de quoi lister les changements.
          fetch-depth: 2
      - name: Changements (extension ou workflow)
        id: changes
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "déclenché à la main : tout tourne"; exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD | grep -E '^(extensions/vscode/|\.github/workflows/ya-extension\.yml$)' || true)
          if [ -n "$changed" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "fichiers de l'extension changés :"; echo "$changed"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "extension inchangée : succès sans rien lancer"
          fi
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      # Pas de scripts d'installation : esbuild prend son binaire dans sa dépendance
      # optionnelle de plateforme ; keytar (dépendance de vsce, publication seulement) n'est
      # ni compilé ni téléchargé.
      - name: Install (npm ci, sans scripts)
        if: steps.changes.outputs.run == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck (tsc --noEmit)
        if: steps.changes.outputs.run == 'true'
        run: npm run typecheck
      - name: Lint
        if: steps.changes.outputs.run == 'true'
        run: npm run lint
      - name: Unit tests
        if: steps.changes.outputs.run == 'true'
        run: npm run test:unit
      - name: Package (.vsix < 5 Mo)
        if: steps.changes.outputs.run == 'true'
        run: npm run package
      - name: Upload .vsix
        if: steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yusagent-vsix-${{ github.sha }}
          path: extensions/vscode/yusagent.vsix
          if-no-files-found: error
      - name: e2e (VS Code 1.146.0 + xvfb, agent factice)
        # yusAgent (ticket 31, X3) : lancé même si une étape précédente du job a échoué (tests
        # unitaires rouges d'un push de tests seuls), pour voir aussi ses cas en échec.
        if: ${{ !cancelled() && steps.changes.outputs.run == 'true' }}
        run: xvfb-run -a npm run test:e2e

  # yusAgent (YA-10, ticket 24, PR 3, étape 6, option D de Yusuf) : e2e de l'extension contre le vrai
  # binaire, construit ici (debug), aucune ligne de `ci.yml`. Périmètre de C15 : extension, pont ACP,
  # `bash.py` du runtime, skill `edit` (et ce fichier) ; sortie rapide en succès sinon.
  # Cache cargo : celui des shards de `ci.yml` (`shared-key: test-shards`), en lecture seule. La clé
  # de Swatinem/rust-cache ne dépend ni du workflow ni du job avec `shared-key` : préfixe, OS et
  # architecture, empreinte de rustc et des variables CARGO*/RUST*/CC* (posées ici comme dans `ci.yml`
  # par la même toolchain épinglée), empreinte des lockfiles. Un run de PR lit les caches de `main`.
  # Jamais d'écriture (`save-if: false`) : le quota de caches est plein, pas d'éviction en plus.
  # Aucun secret, aucun modèle (règle 6) : provider factice.
  real-binary:
    name: e2e vrai binaire (build debug, provider factice)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 45
    # yusAgent (YA-11, ticket 41): no guard mechanism on Linux before PR C; the kernel would refuse.
    env:
      PRIME_AGENT_SECRET_GUARD: "off"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Changements (périmètre C15)
        id: changes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "déclenché à la main : tout tourne"; exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD | grep -E '^(extensions/vscode/|crates/pa-daemon/src/acp/|prime-agent-runtime/src/rlm/bash\.py$|skills/edit/|\.github/workflows/ya-extension\.yml$)' || true)
          if [ -n "$changed" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "fichiers du périmètre changés :"; echo "$changed"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "périmètre inchangé : succès sans rien lancer"
          fi
      - uses: dtolnay/rust-toolchain@ce678459e9fc7500d337468f904b95f1b5c10b5e # 1.98.1, même épingle que ci.yml
        if: steps.changes.outputs.run == 'true'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2, même épingle que ci.yml
        if: steps.changes.outputs.run == 'true'
        with:
          shared-key: test-shards
          save-if: false
      - name: Build du binaire (debug, comme les shards de ci.yml)
        if: steps.changes.outputs.run == 'true'
        run: cargo build --locked --workspace --bins
      - name: Install uv (préparation du venv du kernel)
        if: steps.changes.outputs.run == 'true'
        run: |
          python3 -m pip install --user uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Venv du kernel
        if: steps.changes.outputs.run == 'true'
        run: ./target/debug/prime-agent --prime-agent-bootstrap
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - name: Install (npm ci, sans scripts)
        if: steps.changes.outputs.run == 'true'
        working-directory: extensions/vscode
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: e2e (VS Code 1.146.0 + xvfb, vrai binaire)
        if: steps.changes.outputs.run == 'true'
        working-directory: extensions/vscode
        env:
          YUSAGENT_E2E_BINARY: ${{ github.workspace }}/target/debug/prime-agent
        run: |
          # Le venv, pas son Python : avec PRIME_AGENT_KERNEL_PYTHON, les skills Python (dont edit)
          # seraient désactivés (run 44918462066 : « No module named 'edit' »).
          export PRIME_AGENT_KERNEL_VENV="${HOME}/.yusagent/kernel-venv"
          test -x "${PRIME_AGENT_KERNEL_VENV}/bin/python"
          xvfb-run -a npm run test:e2e:real
